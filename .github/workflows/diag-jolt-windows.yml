# Throwaway: finds out why the Windows + Jolt physics tests started failing.
# Delete this file (and its branch) once the cause is known.
name: diag-jolt-windows
on:
  push:
    branches: ['claude/diag-*']
  workflow_dispatch:

jobs:
  jolt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Jolt v5.7.0 Release,        jolt: v5.7.0, config: Release, extra: ''}
          - {name: Jolt v5.6.0 Debug,          jolt: v5.6.0, config: Debug,   extra: ''}
          - {name: Jolt v5.6.0 Release /O1,    jolt: v5.6.0, config: Release, extra: '-DCMAKE_CXX_FLAGS_RELEASE="/O1 /DNDEBUG"'}
    runs-on: windows-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Which image and compiler
        shell: pwsh
        run: |
          "ImageVersion=$env:ImageVersion ImageOS=$env:ImageOS"
          cmake --version | Select-Object -First 1
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
      - name: Pick the Jolt version
        shell: pwsh
        run: (Get-Content CMakeLists.txt) -replace 'GIT_TAG        v5.6.0', 'GIT_TAG        ${{ matrix.jolt }}' | Set-Content CMakeLists.txt
      - name: Configure
        run: cmake -S . -B build -DTHISTLE_BUILD_SMOKETEST=ON -DTHISTLE_PHYSICS3D=ON ${{ matrix.extra }}
      - name: Build the two failing tests
        run: cmake --build build --config ${{ matrix.config }} --target thistle_physics3d_smoketest thistle_destruction_smoketest --parallel
      - name: Run them
        shell: pwsh
        run: |
          $rc = 0
          foreach ($t in 'thistle_physics3d_smoketest','thistle_destruction_smoketest') {
            "=== $t"
            & ".\build\Release\$t.exe" 2>&1 | Select-String -Pattern 'FAIL|FAILED|passed|rests|lands' | ForEach-Object { $_.Line }
            if ($LASTEXITCODE -ne 0) { $rc = 1 }
          }
          exit $rc

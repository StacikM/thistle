name: CI

# Builds the engine (and the example programs) on real macOS, Windows, and
# Linux runners on every push/PR to main, with and without the opt-in Jolt
# physics, then runs the headless ctest suites (networking, scenes, and the
# 3D ones — see the add_test() calls in CMakeLists.txt). The demos and
# thistle_smoketest open a real window and never exit on their own, so
# they're built here (catches link/compile regressions — this exact CI would
# have caught both Windows-specific bugs already found by hand this
# project) but never executed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you re-run it manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false   # one platform failing shouldn't hide the other two's results
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # The optional modules (Jolt physics, the Dear ImGui debug UI) are
        # built and tested both ways, so neither they nor the stand-ins used
        # without them rot unnoticed.
        modules: [OFF, ON]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (optional modules ${{ matrix.modules }})

    steps:
      - uses: actions/checkout@v4

      # sokol's desktop-GL backend needs real X11/GL dev headers to link
      # against; GitHub's ubuntu-latest image doesn't ship them by default.
      # This is genuinely the first time this platform's build gets tried
      # anywhere — nobody has run a game on it yet (see docs/building.md) —
      # so treat a red X here as real, useful information, not a fluke.
      - name: Install Linux GL/X11 dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev

      # sokol/stb/miniaudio/fontstash are fetched from `master` (only box2d
      # is pinned — see CMakeLists.txt), so this cache can go stale if
      # upstream changes; it's keyed on CMakeLists.txt so a real dependency
      # change busts it, same tradeoff as a long-lived local build/_deps dir.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-modules-${{ matrix.modules }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DTHISTLE_BUILD_SMOKETEST=ON -DCMAKE_BUILD_TYPE=Release -DTHISTLE_PHYSICS3D=${{ matrix.modules }} -DTHISTLE_DEBUG_UI=${{ matrix.modules }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test (headless suites — no GPU/display needed)
        run: ctest --test-dir build -C Release --output-on-failure

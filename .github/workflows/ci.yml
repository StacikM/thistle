name: CI

# Builds the engine (and the example programs) on real macOS, Windows, and
# Linux runners on every push/PR to main, with and without the opt-in Jolt
# physics, then runs the headless ctest suites (networking, scenes, and the
# 3D ones — see the add_test() calls in CMakeLists.txt). The demos and
# thistle_smoketest open a real window and never exit on their own, so
# they're built here (catches link/compile regressions — this exact CI would
# have caught both Windows-specific bugs already found by hand this
# project) but never executed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you re-run it manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false   # one platform failing shouldn't hide the other two's results
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # The optional modules (Jolt physics, the Dear ImGui debug UI) are
        # built and tested both ways, so neither they nor the stand-ins used
        # without them rot unnoticed.
        modules: [OFF, ON]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (optional modules ${{ matrix.modules }})

    steps:
      - uses: actions/checkout@v4

      # sokol's desktop-GL backend needs real X11/GL dev headers to link
      # against; GitHub's ubuntu-latest image doesn't ship them by default.
      # This is genuinely the first time this platform's build gets tried
      # anywhere — nobody has run a game on it yet (see docs/building.md) —
      # so treat a red X here as real, useful information, not a fluke.
      - name: Install Linux GL/X11 dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev

      # sokol/stb/miniaudio/fontstash are fetched from `master` (only box2d
      # is pinned — see CMakeLists.txt), so this cache can go stale if
      # upstream changes; it's keyed on CMakeLists.txt so a real dependency
      # change busts it, same tradeoff as a long-lived local build/_deps dir.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-modules-${{ matrix.modules }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DTHISTLE_BUILD_SMOKETEST=ON -DCMAKE_BUILD_TYPE=Release -DTHISTLE_PHYSICS3D=${{ matrix.modules }} -DTHISTLE_DEBUG_UI=${{ matrix.modules }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test (headless suites — no GPU/display needed)
        run: ctest --test-dir build -C Release --output-on-failure

      # The Thistle Editor is its own project on top of the engine (see
      # tools/thistle-editor): build it too, so it can't stop compiling on one
      # platform unnoticed. It doesn't use the optional modules, so once per
      # OS is enough. Like the demos, it's built, never run here.
      - name: Build the Thistle Editor
        if: matrix.modules == 'OFF'
        run: |
          cmake -S tools/thistle-editor -B build-editor -DCMAKE_BUILD_TYPE=Release
          cmake --build build-editor --config Release

  # A dedicated server's build: only thistle_server (-DTHISTLE_SERVER_ONLY=ON),
  # then the headless tests against it, server_smoketest included. On Linux
  # it runs in a bare Ubuntu with nothing but a compiler, CMake and git, like
  # a fresh VPS or a Docker image: proof it needs no X11/OpenGL/audio
  # packages, and a last check that nothing of the sort got linked anyway.
  server-linux:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    name: ubuntu:24.04 container (server only)
    steps:
      - name: Install a compiler, CMake and git (nothing else)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++ cmake make git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-server -DTHISTLE_SERVER_ONLY=ON -DTHISTLE_BUILD_SMOKETEST=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-server --parallel
      - name: Test
        run: ctest --test-dir build-server --output-on-failure
      - name: No graphics or audio libraries linked
        run: |
          ldd build-server/thistle_server_smoketest
          if ldd build-server/thistle_server_smoketest | grep -E 'libX|libGL|libEGL|asound|pulse'; then
            echo "the server build links a graphics or audio library"; exit 1
          fi

  server:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (server only)
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-server -DTHISTLE_SERVER_ONLY=ON -DTHISTLE_BUILD_SMOKETEST=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-server --config Release --parallel
      - name: Test
        run: ctest --test-dir build-server -C Release --output-on-failure

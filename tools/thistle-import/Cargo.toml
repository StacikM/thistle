[package]
name = "thistle-import"
version = "0.1.0"
edition = "2021"
description = "thistle import-unity, in Rust: the same converter as tools/thistle-cli/unity_import.py, much faster on big Unity projects"
publish = false

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
